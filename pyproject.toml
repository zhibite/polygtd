[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-gtd"
version = "0.1.0"
description = "Polymarket BTC 15m Up/Down martingale bot (post-only GTD)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "py-clob-client-v2>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=8.2",
    "eth-account>=0.13",
    "eth-utils>=4.1",
    "poly-eip712-structs>=0.0.1",
    "py-order-utils>=0.3.2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

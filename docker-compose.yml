services:
  polymarket-gtd:
    build: .
    container_name: polymarket-gtd
    restart: unless-stopped
    ports:
      - "8034:8034"
    volumes:
      - polymarket_data:/app/data
    env_file:
      - .env.docker
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

volumes:
  polymarket_data:
    driver: local

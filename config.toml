###############################################################################
# Polymarket BTC 15m Up/Down bot configuration
###############################################################################

[GENERAL]
ROUND_PERIOD_S=900
WINDOW_PRE_OPEN_S=300

[BINANCE]
WS_URL=wss://stream.binance.com:9443/ws/btcusdt@trade
RECONNECT_BASE_S=1.0
RECONNECT_MAX_S=30.0
BUFFER_RETENTION_S=1200

[ROUND_CLOCK]
TIMEZONE=local

[BASELINE]
WINDOW_S=300
MIN_SAMPLES=30

[LOG]
LEVEL=INFO
HEARTBEAT_S=5

[POLL]
# H-V6-12 fix: REST /book fallback so a missing WS best_bid/ask event does
# not stall T1 entry for an entire round. The poller only writes into
# PriceCache.best_bid / best_ask when WS has not yet seeded those fields
# (i.e. WS still wins once a `best_bid_ask` event finally lands). Set
# REST_BOOK_POLL_S=0 to disable.
REST_BOOK_POLL_S=2.0

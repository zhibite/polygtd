<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交易记录 - PolyGTD</title>
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
</head>
<body>
<nav>
  <span class="brand">PolyGTD</span>
  <a href="/">控制台</a>
  <a href="/trades" class="active">交易记录</a>
  <a href="/config">策略配置</a>
  <div class="nav-right">
    <span id="auth-area" class="nav-auth"></span>
    <span class="live-dot" id="live-dot"></span>
    <span id="live-label">连接中</span>
    <span id="clock" class="mono"></span>
  </div>
</nav>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">今日盈亏 (UTC)</div>
      <div class="stat-value" id="today-pnl">--</div>
      <div class="stat-sub" id="today-rounds">-- 轮</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累计盈亏</div>
      <div class="stat-value" id="total-pnl">--</div>
      <div class="stat-sub" id="total-rounds">-- 轮已结算</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">胜率</div>
      <div class="stat-value purple" id="win-rate">--</div>
      <div class="stat-sub" id="win-loss">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">盈亏比 (Profit Factor)</div>
      <div class="stat-value orange" id="profit-factor">--</div>
      <div class="stat-sub" id="avg-win-loss">--</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Maker 成交占比</div>
      <div class="stat-value purple" id="q-maker">--</div>
      <div class="stat-sub" id="q-maker-sub">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">卖价 vs 挂价</div>
      <div class="stat-value" id="q-sell-bps">--</div>
      <div class="stat-sub" id="q-buy-bps">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">撤单率</div>
      <div class="stat-value" id="q-cancel">--</div>
      <div class="stat-sub" id="q-cancel-sub">--</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">平均成交耗时</div>
      <div class="stat-value" id="q-fill-time">--</div>
      <div class="stat-sub">挂单 → 首笔成交</div>
    </div>
  </div>

  <div class="section">
    <h2>轮次记录 <span class="pill" id="round-count">0</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>开始 (UTC)</th><th>轮次</th><th>买入成本</th><th>卖出收入</th>
            <th>手续费</th><th>盈亏</th><th>盈亏 %</th><th>成交笔数</th><th>撤单</th><th>状态</th>
          </tr>
        </thead>
        <tbody id="rounds-tbody"><tr><td colspan="10" class="no-data">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>成交明细 <span class="pill" id="fill-count">0</span></h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>时间 (UTC)</th><th>轮次</th><th>层</th><th>方向</th><th>价格</th><th>挂价</th><th>价差</th><th>数量</th><th>金额</th><th>手续费</th><th>方式</th></tr>
        </thead>
        <tbody id="fills-tbody"><tr><td colspan="11" class="no-data">加载中...</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="fills-pager" hidden>
      <button class="btn btn-ghost btn-sm" id="fill-prev" type="button">上一页</button>
      <span class="pager-info" id="fill-page-info">--</span>
      <button class="btn btn-ghost btn-sm" id="fill-next" type="button">下一页</button>
    </div>
  </div>
</div>

<footer>PolyGTD · 数据来自 polymarket.db · 时间均为 UTC</footer>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n, d = 2) => (n === null || n === undefined || isNaN(n)) ? '--' : Number(n).toFixed(d);
const money = (n) => (n === null || n === undefined || isNaN(n)) ? '--' : (n >= 0 ? '+$' : '-$') + Math.abs(n).toFixed(2);
const cls = (n) => (n > 0 ? 'green' : n < 0 ? 'red' : '');
const utc = (ts) => ts ? new Date(ts * 1000).toISOString().slice(11, 19) : '--';
const iso = (s) => s ? new Date(s).toISOString().replace('T', ' ').slice(0, 19) : '--';

// 成交明细分页：每页 20 条，服务端按 (ts_ms, fill_id) 倒序切片。
const FILL_PAGE_SIZE = 20;
let fillOffset = 0;
let fillTotal = 0;

function setLive(ok) {
  $('live-dot').className = 'live-dot' + (ok ? '' : ' offline');
  $('live-label').textContent = ok ? '在线' : '离线';
}

async function getJSON(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (r.status === 401) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
    throw new Error('需要登录');
  }
  if (!r.ok) throw new Error(path + ' ' + r.status);
  return await r.json();
}

function renderStats(stats) {
  if (!stats) return;
  const today = stats.today_pnl_usd || 0;
  $('today-pnl').textContent = money(today);
  $('today-pnl').className = 'stat-value ' + cls(today);
  $('today-rounds').textContent = (stats.today_rounds || 0) + ' 轮已结算';

  const total = stats.total_pnl_usd || 0;
  $('total-pnl').textContent = money(total);
  $('total-pnl').className = 'stat-value ' + cls(total);
  $('total-rounds').textContent = (stats.closed_rounds || 0) + ' 轮已结算 · ' + (stats.open_rounds || 0) + ' 轮未平';

  $('win-rate').textContent = stats.win_rate === null ? '--' : (stats.win_rate * 100).toFixed(1) + '%';
  $('win-loss').textContent = `${stats.wins || 0} 胜 / ${stats.losses || 0} 负`;
  $('profit-factor').textContent = stats.profit_factor === null ? '--' : fmt(stats.profit_factor, 2);
  $('avg-win-loss').textContent = `均赢 ${money(stats.avg_win_usd || 0)} · 均亏 ${money(stats.avg_loss_usd || 0)}`;
}

function renderQuality(q) {
  if (!q) return;
  $('q-maker').textContent = q.maker_ratio === null ? '--' : (q.maker_ratio * 100).toFixed(0) + '%';
  $('q-maker-sub').textContent =
    (q.maker_fills || 0) + ' maker · ' + (q.taker_fills || 0) + ' taker' +
    (q.unknown_fills ? ' · ' + q.unknown_fills + ' 未知' : '');

  const sell = q.sell_improvement_bps;
  $('q-sell-bps').textContent = sell === null ? '--' : (sell >= 0 ? '+' : '') + sell.toFixed(0) + ' bps';
  $('q-sell-bps').className = 'stat-value ' + (sell === null ? '' : cls(sell));
  const buy = q.buy_improvement_bps;
  $('q-buy-bps').textContent = '买入：' + (buy === null ? '--' : (buy >= 0 ? '+' : '') + buy.toFixed(0) + ' bps');

  $('q-cancel').textContent = q.cancel_ratio === null ? '--' : (q.cancel_ratio * 100).toFixed(0) + '%';
  $('q-cancel-sub').textContent = (q.cancelled_orders || 0) + ' / ' + (q.total_orders || 0) + ' 笔订单';
  $('q-fill-time').textContent = q.avg_time_to_fill_s === null ? '--' : q.avg_time_to_fill_s.toFixed(1) + 's';
}

function renderRounds(rounds) {
  $('round-count').textContent = rounds.length;
  const body = $('rounds-tbody');
  if (!rounds.length) {
    body.innerHTML = '<tr><td colspan="10" class="no-data">暂无记录（下单成交后会出现在这里）</td></tr>';
    return;
  }
  body.innerHTML = rounds.map(r => {
    const pnl = r.pnl_usd;
    // "未平仓" only when a BUY actually filled. A round whose orders were
    // all rejected / never filled has no position — label it 未成交.
    const status = r.closed
      ? '<span class="pill filled">已结算</span>'
      : (r.fill_count > 0
          ? '<span class="pill watching">未平仓</span>'
          : '<span class="pill idle">未成交</span>');
    return `<tr>
      <td class="mono">${iso(r.started_at) === '--' ? utc(r.round_start_ts) : iso(r.started_at)}</td>
      <td class="mono muted">${r.slug || r.round_start_ts}</td>
      <td class="mono">$${fmt(r.buy_cost, 2)}</td>
      <td class="mono">$${fmt(r.sell_proceeds, 2)}</td>
      <td class="mono muted">$${fmt(r.fee_total, 2)}</td>
      <td class="mono ${pnl === null ? '' : cls(pnl)}">${pnl === null ? '--' : money(pnl)}</td>
      <td class="mono ${pnl === null ? '' : cls(pnl)}">${r.pnl_pct === null ? '--' : fmt(r.pnl_pct * 100, 2) + '%'}</td>
      <td class="mono">${r.fill_count}</td>
      <td class="mono muted">${r.cancel_count || 0}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
}

function renderFills(fills) {
  const body = $('fills-tbody');
  if (!fills.length) {
    body.innerHTML = '<tr><td colspan="11" class="no-data">暂无成交</td></tr>';
    return;
  }
  body.innerHTML = fills.map(f => {
    const imp = f.improvement_bps;
    const impTxt = imp === null || imp === undefined
      ? '--'
      : (imp >= 0 ? '+' : '') + imp.toFixed(0) + ' bps';
    const role = (f.trader_side || '').toUpperCase();
    const roleLbl = role === 'MAKER' ? 'maker' : role === 'TAKER' ? 'taker' : '--';
    const roleCls = role === 'MAKER' ? 'watching' : role === 'TAKER' ? 'placed' : 'idle';
    return `<tr>
      <td class="mono">${f.ts_ms ? new Date(f.ts_ms).toISOString().replace('T', ' ').slice(0, 19) : '--'}</td>
      <td class="mono">${utc(f.round_start_ts)}</td>
      <td>${f.tier || '--'}</td>
      <td><span class="pill ${f.side === 'BUY' ? 'buy' : 'sell'}">${f.side}</span></td>
      <td class="mono">${fmt(f.price, 4)}</td>
      <td class="mono muted">${f.limit_price > 0 ? fmt(f.limit_price, 4) : '--'}</td>
      <td class="mono ${imp === null || imp === undefined ? '' : cls(imp)}">${impTxt}</td>
      <td class="mono">${fmt(f.size, 2)}</td>
      <td class="mono">$${fmt(f.notional, 2)}</td>
      <td class="mono muted">${f.fee > 0 ? '$' + fmt(f.fee, 4) : '--'}</td>
      <td><span class="pill ${roleCls}">${roleLbl}</span></td>
    </tr>`;
  }).join('');
}

function renderFillPager() {
  const pages = Math.max(1, Math.ceil(fillTotal / FILL_PAGE_SIZE));
  const page = Math.floor(fillOffset / FILL_PAGE_SIZE) + 1;
  $('fill-count').textContent = fillTotal;
  $('fill-page-info').textContent = `第 ${page} / ${pages} 页 · 共 ${fillTotal} 笔`;
  $('fill-prev').disabled = fillOffset <= 0;
  $('fill-next').disabled = fillOffset + FILL_PAGE_SIZE >= fillTotal;
  // 只有一页时不需要分页条。
  $('fills-pager').hidden = fillTotal <= FILL_PAGE_SIZE;
}

async function refreshFills() {
  const d = await getJSON(
    `/api/fills?limit=${FILL_PAGE_SIZE}&offset=${fillOffset}`
  );
  fillTotal = Number(d.total || 0);
  // 记录变少（理论上不会发生）时把越界的页码拉回最后一页。
  const pages = Math.max(1, Math.ceil(fillTotal / FILL_PAGE_SIZE));
  const maxOffset = (pages - 1) * FILL_PAGE_SIZE;
  if (fillOffset > maxOffset) {
    fillOffset = maxOffset;
    return refreshFills();
  }
  renderFills(d.fills || []);
  renderFillPager();
}

async function refresh() {
  try {
    const d = await getJSON('/api/trades?limit=300');
    renderStats(d.stats);
    renderQuality(d.quality);
    renderRounds(d.rounds || []);
    await refreshFills();
    setLive(true);
  } catch (e) {
    setLive(false);
  }
}

$('fill-prev').addEventListener('click', () => {
  if (fillOffset < FILL_PAGE_SIZE) return;
  fillOffset -= FILL_PAGE_SIZE;
  refreshFills().catch(() => setLive(false));
});
$('fill-next').addEventListener('click', () => {
  if (fillOffset + FILL_PAGE_SIZE >= fillTotal) return;
  fillOffset += FILL_PAGE_SIZE;
  refreshFills().catch(() => setLive(false));
});

$('clock').textContent = new Date().toISOString().slice(11, 19) + ' UTC';
setInterval(() => { $('clock').textContent = new Date().toISOString().slice(11, 19) + ' UTC'; }, 1000);
refresh();
setInterval(refresh, 10000);
</script>
<script src="/static/auth-nav.js?v=__ASSET_VERSION__"></script>
</body>
</html>
